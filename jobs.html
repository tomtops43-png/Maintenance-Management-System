<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HTML itself carries no ?v= cache-buster, and GitHub Pages serves it with
     max-age=600 — an iOS home-screen app can then sit on a stale page long
     past that. Only the page shell is uncached; css/js still cache hard
     behind their ?v= query string, so this costs a few KB per load. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>บอร์ดงาน — Maintenance System Assembly Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=43">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=43">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=43">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assembly Line">
<meta name="theme-color" content="#2563eb">
</head>
<body data-page="jobs" data-title="บอร์ดงานซ่อม">
<div class="container">
  <div class="filters">
    <select id="fLine"><option value="">ทุกไลน์</option></select>
    <select id="fShift"><option value="">ทุกกะ</option><option value="A">กะ A</option><option value="B">กะ B</option></select>
    <input type="date" id="fDate">
    <button class="btn small secondary" id="refreshBtn">รีเฟรช</button>
  </div>

  <div class="board" id="board"></div>
</div>

<!-- Close job modal -->
<div class="modal-backdrop" id="closeModal">
  <div class="modal">
    <button type="button" class="modal-close" id="closeModalXBtn" aria-label="ปิด">&times;</button>
    <h2>ปิดงาน <span id="closeMtJob" class="pill"></span></h2>
    <div class="field">
      <label>ประเภทปัญหาหลัก (Main_Issue) <span class="req">*</span></label>
      <select id="cMainIssue"></select>
    </div>
    <div class="field">
      <label>Issue (อาการ/จุดที่เสีย)</label>
      <input id="cIssue" list="cIssueList" placeholder="เลือกหรือพิมพ์เอง">
      <datalist id="cIssueList"></datalist>
    </div>
    <div class="field"><label>รายละเอียดปัญหา (Detail)</label><textarea id="cDetail"></textarea></div>
    <div class="field"><label>การแก้ไข (Improvements)</label><textarea id="cImprove"></textarea></div>
    <div class="field">
      <label>ผู้ซ่อม (By)</label>
      <input id="cBy" readonly>
      <div class="hint">อัตโนมัติจากผู้ใช้ที่เข้าสู่ระบบ</div>
    </div>
    <div class="hint" id="cTimeInfo" style="margin-bottom:14px">เวลาที่ใช้ซ่อม: คำนวณอัตโนมัติตอนบันทึกปิดงาน</div>
    <div class="field">
      <label>รูปหลังซ่อม (ถ่ายใหม่ หรือเลือกจากคลังภาพ)</label>
      <!-- No capture= — see index.html: it would lock this to the camera. -->
      <input type="file" id="cPhoto" accept="image/*">
      <img id="cPhotoPreview" class="photo-preview" alt="preview">
    </div>
    <div class="btn-group">
      <button class="btn success" id="confirmCloseBtn">บันทึกปิดงาน</button>
      <button class="btn secondary" id="cancelCloseBtn">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- Related KB articles bottom sheet -->
<div class="modal-backdrop" id="kbRelatedModal">
  <div class="modal">
    <button type="button" class="modal-close" id="kbRelatedXBtn" aria-label="ปิด">&times;</button>
    <h2>💡 บทความที่เกี่ยวข้อง</h2>
    <div id="kbRelatedList"></div>
  </div>
</div>

<!-- Job detail (read-only) — any status, opened by tapping the card -->
<div class="modal-backdrop" id="jobDetailModal">
  <div class="modal">
    <button type="button" class="modal-close" id="jobDetailXBtn" aria-label="ปิด">&times;</button>
    <h2>รายละเอียดงาน <span id="jdMtJob" class="pill"></span></h2>
    <div id="jobDetailBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="loading-overlay" id="overlay"><div class="load-card"><div class="spinner"></div><span>กำลังโหลด...</span></div></div>

<script src="js/config.js?v=43"></script>
<script src="js/utils.js?v=43"></script>
<script src="js/api.js?v=43"></script>
<script src="js/auth.js?v=43"></script>
<script src="js/layout.js?v=43"></script>
<script src="js/jobs.js?v=43"></script>
</body>
</html>
