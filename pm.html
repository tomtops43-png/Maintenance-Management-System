<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HTML itself carries no ?v= cache-buster, and GitHub Pages serves it with
     max-age=600 — an iOS home-screen app can then sit on a stale page long
     past that. Only the page shell is uncached; css/js still cache hard
     behind their ?v= query string, so this costs a few KB per load. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PM — Maintenance System Assembly Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=61">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=61">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=61">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assembly Line">
<meta name="theme-color" content="#2563eb">
</head>
<body data-page="pm" data-title="บำรุงรักษาเชิงป้องกัน (PM)">
<div class="container">
  <div class="tabs" id="pmTabs">
    <button data-tab="due" class="active">ถึงกำหนด <span class="tab-badge" id="dueCount"></span></button>
    <button data-tab="bulk">ลงหลายรายการ</button>
    <button data-tab="check">เช็กรายเครื่อง</button>
    <button data-tab="all">แผน PM ทั้งหมด</button>
  </div>

  <div class="filters">
    <select id="fArea"></select>
    <select id="fLine"></select>
    <select id="fMc"></select>
    <select id="fShift"></select>
    <button class="btn small secondary" id="pmClear" style="display:none">ล้างตัวกรอง</button>
    <button class="btn small secondary" id="pmRefresh">รีเฟรช</button>
  </div>

  <div id="dueView"></div>
  <div id="bulkView" style="display:none"></div>
  <div id="checkView" style="display:none"></div>
  <div id="allView" style="display:none"></div>
</div>

<!-- Do PM modal -->
<div class="modal-backdrop" id="pmModal">
  <div class="modal">
    <button type="button" class="modal-close" id="pmModalXBtn" aria-label="ปิด">&times;</button>
    <h2>ทำ PM <span id="pmModalId" class="pill"></span></h2>
    <div id="pmModalItem" class="hint" style="margin-bottom:12px"></div>
    <!-- What the plan says to do, as the admin wrote it: reference photo,
         method and notes. Filled per plan in js/pm.js openModal(). -->
    <div id="pmRef" class="pm-ref" style="display:none">
      <a id="pmRefPhotoLink" target="_blank" rel="noopener" style="display:none">
        <img id="pmRefPhoto" class="pm-ref-photo" alt="รูปอ้างอิงจากแผน PM" loading="lazy">
      </a>
      <div id="pmRefStd" class="pm-ref-text"></div>
      <div id="pmRefNotes" class="pm-ref-text hint"></div>
    </div>
    <div class="field">
      <label>กะที่ทำ <span class="req">*</span></label>
      <div class="tabs">
        <button type="button" id="shiftA">กะ A</button>
        <button type="button" id="shiftB">กะ B</button>
      </div>
      <div id="pmShiftHint" class="hint"></div>
    </div>
    <div class="field">
      <label>ผลการตรวจ <span class="req">*</span></label>
      <div class="tabs">
        <button type="button" id="resOK" class="active">OK ✓</button>
        <button type="button" id="resNG">NG ✗</button>
      </div>
    </div>
    <div class="field" id="ngBox" style="display:none">
      <label>รายละเอียดปัญหา (NG)</label>
      <textarea id="pmNgDetail"></textarea>
    </div>
    <div class="field">
      <label>การดำเนินการ (Action Taken)</label>
      <!-- OK: pick a sentence. NG: type it — see ACTION_SETS in js/pm.js. -->
      <select id="pmActionSelect"></select>
      <textarea id="pmAction" placeholder="พิมพ์สิ่งที่ทำไป"></textarea>
    </div>
    <div class="field">
      <label>รูปหลังทำ PM <span class="req">*</span> (ถ่ายใหม่ หรือเลือกจากคลังภาพ)</label>
      <div class="hint">บังคับแนบ — เป็นหลักฐานว่าทำ PM จริง</div>
      <!-- No capture= — see index.html: it would lock this to the camera. -->
      <input type="file" id="pmPhoto" accept="image/*">
      <img id="pmPhotoPreview" class="photo-preview" alt="preview">
    </div>
    <div class="btn-group">
      <button class="btn success" id="pmSubmitBtn">บันทึกผล PM</button>
      <button class="btn secondary" id="pmCancelBtn">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- One plan's sign-off history: who, when, which shift, photo — filled by
     js/pm.js renderHistory(). -->
<div class="modal-backdrop" id="pmHistModal">
  <div class="modal">
    <button type="button" class="modal-close" id="pmHistXBtn" aria-label="ปิด">&times;</button>
    <div id="pmHistBody"></div>
    <div class="btn-group" style="margin-top:14px">
      <button class="btn success" id="pmHistDoBtn">ทำ PM รอบนี้</button>
      <button class="btn secondary" id="pmHistCloseBtn">ปิด</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="loading-overlay" id="overlay"><div class="load-card"><div class="spinner"></div><span>กำลังโหลด...</span></div></div>

<script src="js/config.js?v=61"></script>
<script src="js/utils.js?v=61"></script>
<script src="js/api.js?v=61"></script>
<script src="js/auth.js?v=61"></script>
<script src="js/layout.js?v=61"></script>
<script src="js/pm.js?v=61"></script>
</body>
</html>
