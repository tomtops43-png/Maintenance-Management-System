<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HTML itself carries no ?v= cache-buster, and GitHub Pages serves it with
     max-age=600 — an iOS home-screen app can then sit on a stale page long
     past that. Only the page shell is uncached; css/js still cache hard
     behind their ?v= query string, so this costs a few KB per load. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>รายงาน PM (Audit) — Maintenance System Assembly Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=53">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=53">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=53">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assembly Line">
<meta name="theme-color" content="#2563eb">
</head>
<body data-page="audit" data-title="รายงาน PM สำหรับ Audit">
<div class="container">
  <div class="filters no-print">
    <input type="date" id="fFrom" aria-label="ตั้งแต่วันที่">
    <input type="date" id="fTo" aria-label="ถึงวันที่">
    <select id="fPeriod" aria-label="ช่วงเวลาสำเร็จรูป">
      <option value="">— ช่วงเวลา —</option>
      <option value="month">เดือนนี้</option>
      <option value="lastmonth">เดือนที่แล้ว</option>
      <option value="quarter">ไตรมาสนี้</option>
      <option value="year">ปีนี้</option>
    </select>
    <select id="fArea" aria-label="ไลน์หลัก"></select>
    <select id="fLine" aria-label="ไลน์"></select>
    <select id="fMc" aria-label="เครื่อง"></select>
    <button class="btn small" id="goBtn">สร้างรายงาน</button>
    <button class="btn small secondary" id="printBtn" disabled>🖨️ พิมพ์ / บันทึก PDF</button>
    <button class="btn small secondary" id="csvBtn" disabled>⬇️ CSV</button>
  </div>

  <div id="report">
    <div class="empty">เลือกช่วงเวลาแล้วกด “สร้างรายงาน”</div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="loading-overlay" id="overlay"><div class="load-card"><div class="spinner"></div><span>กำลังโหลด...</span></div></div>

<script src="js/config.js?v=53"></script>
<script src="js/utils.js?v=53"></script>
<script src="js/api.js?v=53"></script>
<script src="js/auth.js?v=53"></script>
<script src="js/layout.js?v=53"></script>
<script src="js/audit.js?v=53"></script>
</body>
</html>
